<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootcamp App</title>
    <script>
      // Start in the saved theme before the app loads, so a dark-theme page never flashes white.
      // The app (src/settings.jsx) takes over once the settings arrive from the server.
      (function () {
        var theme = 'system';
        try { theme = localStorage.getItem('bootcamp-theme') || 'system'; } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
